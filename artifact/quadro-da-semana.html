<title>Quadro da semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap">
<style>
:root {
  --bg: #f6f5f0;
  --surface: #fffffc;
  --surface-2: #f1f0ea;
  --ink: #152120;
  --muted: #5a6765;
  --line: #d3dbd8;
  --grid: #e4e9f1;
  --grid-hour: #cad3e2;
  --accent: var(--pal-accent, #4a5bb8);
  --accent-ink: #ffffff;
  --accent-soft: var(--pal-soft, #e4e7f8);
  --go: var(--pal-accent, #4a5bb8);
  --go-hover: var(--pal-accent-2, #3b4a9c);
  --go-ink: #ffffff;
  --danger: #b91c1c;
  --warn: #b45309;
  --today: #fff8e6;
  --today-head: #fcebbd;
  --now: #e11d48;
  --ok: rgba(22, 163, 74, 0.2);
  --ok-line: #16a34a;
  --no: rgba(220, 38, 38, 0.16);
  --no-line: #dc2626;
  --shadow: 0 1px 2px rgba(16, 24, 23, 0.14);
  --shadow-lg: 0 12px 32px rgba(16, 24, 23, 0.22);
  --overlay: rgba(12, 18, 17, 0.45);
  /* tracking: estado de cada bloco e cor de cada prioridade */
  --st-done: #15803d;
  --st-done-bg: #dcfce7;
  --st-part: #b45309;
  --st-part-bg: #fef3c7;
  --st-swap: #4338ca;
  --st-swap-bg: #e0e7ff;
  --st-skip: #b91c1c;
  --st-skip-bg: #fee2e2;
  --cat-grad: #4f5fc4;
  --cat-ds: #d0408a;
  --cat-code: #0f8a7e;
  --slot-h: 28px;
  --time-w: 50px;
  --head-h: 42px;
  font-family: "Patrick Hand", "Segoe Print", "Comic Neue", ui-rounded, system-ui, sans-serif;
  --hand-title: "Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121318;
    --surface: #191a21;
    --surface-2: #20222a;
    --ink: #e3ebe9;
    --muted: #93a29f;
    --line: #2b3634;
    --grid: #20242e;
    --grid-hour: #2d3342;
    --accent: var(--pal-accent-d, #9fadf2);
    --accent-ink: #15172a;
    --accent-soft: var(--pal-soft-d, #262a45);
    --go: var(--pal-accent-d, #9fadf2);
    --go-hover: var(--pal-accent-d2, #bcc6f7);
    --go-ink: #15172a;
    --danger: #f87171;
    --warn: #fbbf24;
    --today: #1b1a12;
    --today-head: #3a3012;
    --now: #fb7185;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.6);
    --overlay: rgba(0, 0, 0, 0.6);
    --st-done: #4ade80;
    --st-done-bg: #15301f;
    --st-part: #fbbf24;
    --st-part-bg: #352a10;
    --st-swap: #a5b4fc;
    --st-swap-bg: #23284a;
    --st-skip: #f87171;
    --st-skip-bg: #3a1a1c;
    --cat-grad: #9aa6f2;
    --cat-ds: #f08cc0;
    --cat-code: #4fd1c0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121318;
  --surface: #191a21;
  --surface-2: #20222a;
  --ink: #e3ebe9;
  --muted: #93a29f;
  --line: #2b3634;
  --grid: #20242e;
  --grid-hour: #2d3342;
  --accent: var(--pal-accent-d, #9fadf2);
  --accent-ink: #15172a;
  --accent-soft: var(--pal-soft-d, #262a45);
  --go: var(--pal-accent-d, #9fadf2);
  --go-hover: var(--pal-accent-d2, #bcc6f7);
  --go-ink: #15172a;
  --danger: #f87171;
  --warn: #fbbf24;
  --today: #1b1a12;
  --today-head: #3a3012;
  --now: #fb7185;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.6);
  --overlay: rgba(0, 0, 0, 0.6);
  --st-done: #4ade80;
  --st-done-bg: #15301f;
  --st-part: #fbbf24;
  --st-part-bg: #352a10;
  --st-swap: #a5b4fc;
  --st-swap-bg: #23284a;
  --st-skip: #f87171;
  --st-skip-bg: #3a1a1c;
  --cat-grad: #9aa6f2;
  --cat-ds: #f08cc0;
  --cat-code: #4fd1c0;
}

* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.3;
  font-synthesis-weight: none;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 7px 12px;
  min-height: 36px;
}
button:hover { background: var(--surface-2); }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, .block:focus-visible, .chip:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button.go { background: var(--go); color: var(--go-ink); border-color: transparent; font-weight: 700; }
button.go:hover { background: var(--go-hover); }
button.accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
button.danger { color: var(--danger); }
button.ghost { border-color: transparent; background: transparent; }
input[type="text"], input[type="date"], input[type="time"], select, textarea.paste {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 7px 10px;
  min-height: 38px;
  width: 100%;
}

/* ---------- top bar ---------- */
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font-family: var(--hand-title); font-weight: 700; font-size: 1.9rem; line-height: 1; }
.sync { font-size: 0.75rem; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--ok-line); }
.sync[data-s="saving"]::before { background: #d97706; }
.sync[data-s="error"]::before, .sync[data-s="readonly"]::before { background: var(--no-line); }
.week-nav { display: flex; align-items: center; gap: 6px; }
.week-nav button { min-width: 36px; padding: 6px 10px; }
#week-label { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 12ch; text-align: center; }
.study {
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--ink);
  border: 1px solid var(--accent);
  padding: 5px 12px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.study:hover { background: var(--accent-soft); border-color: var(--go-hover); }
.study .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-part); flex-shrink: 0; }
.actions { display: flex; gap: 8px; margin-left: auto; align-items: center; }
.menu { position: relative; }
.menu > summary {
  list-style: none;
  cursor: pointer;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 12px;
  min-height: 36px;
  display: flex;
  align-items: center;
  background: var(--surface);
}
.menu > summary::-webkit-details-marker { display: none; }
.menu-pop {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 40;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  padding: 6px;
  display: flex;
  flex-direction: column;
  min-width: 240px;
}
.menu-pop button { border: none; text-align: left; background: transparent; }
.menu-pop button:hover { background: var(--surface-2); }

/* ---------- now strip ---------- */
.now {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  align-items: center;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 0.9rem;
}
.now:empty { display: none; }
.now-item { display: flex; align-items: center; gap: 8px; min-width: 0; }
.now-item .lbl { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.now-item .sw { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.now-item .txt { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.now-item .meta { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.now button { min-height: 30px; padding: 4px 10px; }

/* ---------- layout ---------- */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px 1fr; }
.palette {
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 14px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.palette-head { display: flex; justify-content: space-between; align-items: center; }
.palette h2 { margin: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.palette-head button { min-height: 28px; padding: 3px 10px; font-size: 0.8rem; }
.hint { margin: 0; color: var(--muted); font-size: 0.8rem; }
.chips { display: flex; flex-direction: column; gap: 7px; }
.chip {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 0.86rem;
  font-weight: 700;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  box-shadow: var(--shadow);
  text-align: left;
  width: 100%;
}
.chip.armed { outline: 3px solid var(--ink); outline-offset: 2px; }

.board { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.board-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; border-radius: 0; min-height: 32px; padding: 4px 12px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.day-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tabs button {
  min-height: 32px;
  padding: 3px 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.1;
  font-size: 0.78rem;
  flex-shrink: 0;
}
.day-tabs button b { font-size: 0.72rem; }
.day-tabs button.today { border-color: #d97706; }
.day-tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scroller { flex: 1; min-height: 0; overflow: auto; position: relative; overscroll-behavior: contain; }

/* ---------- calendar ---------- */
.calendar { display: grid; grid-template-rows: var(--head-h) auto; }
.calendar.week { min-width: calc(var(--time-w) + 7 * 108px); }
.corner, .day-head {
  position: sticky;
  top: 0;
  z-index: 6;
  height: var(--head-h);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.corner { left: 0; z-index: 8; }
.day-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 0.85rem;
  border-left: 1px solid var(--line);
}
.day-head .dn { font-family: var(--hand-title); font-weight: 700; font-size: 1.35rem; line-height: 1; }
.day-head .dd { color: var(--muted); font-variant-numeric: tabular-nums; }
.day-head.today { background: var(--today-head); }
.day-head.today .dd { color: var(--ink); }
.time-col {
  position: sticky;
  left: 0;
  z-index: 5;
  background: var(--surface);
  height: calc(var(--slots) * var(--slot-h));
}
.tl {
  position: absolute;
  right: 6px;
  transform: translateY(-50%);
  font-size: 0.7rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tl:first-child { transform: translateY(2px); }
.day-slots {
  position: relative;
  height: calc(var(--slots) * var(--slot-h));
  border-left: 1px solid var(--line);
  background-image:
    linear-gradient(to bottom, var(--grid-hour) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 100% calc(var(--slot-h) * 2), 100% var(--slot-h);
}
.day-slots.today { background-color: var(--today); }
body.armed .day-slots { cursor: copy; }

.block {
  position: absolute;
  left: 3px;
  right: 3px;
  border-radius: 8px;
  padding: 3px 7px 8px;
  font-size: 0.9rem;
  line-height: 1.2;
  overflow: hidden;
  cursor: grab;
  z-index: 2;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 1px;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.block .bt { font-weight: 700; word-break: break-word; }
.block .br { font-size: 0.78rem; opacity: 0.85; font-variant-numeric: tabular-nums; }
.block.tiny { padding-top: 0; padding-bottom: 0; font-size: 0.78rem; line-height: 1.15; }
.block.tiny .bt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block.current { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--now); z-index: 3; }
.block.lifted { opacity: 0.35; }
.rh {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 10px;
  cursor: ns-resize;
  touch-action: none;
}
.rh::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 3px;
  width: 22px;
  height: 3px;
  margin-left: -11px;
  border-radius: 2px;
  background: currentColor;
  opacity: 0;
}
.block:hover .rh::after, .block.resizing .rh::after { opacity: 0.5; }
.calendar.day .rh { height: 16px; }
.calendar.day .rh::after { opacity: 0.4; }
.hatch { background-image: repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.22) 0 7px, transparent 7px 14px) !important; }

.now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 4; pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }

.preview {
  position: absolute;
  left: 3px;
  right: 3px;
  border-radius: 6px;
  z-index: 5;
  pointer-events: none;
  border: 2px dashed var(--ok-line);
  background: var(--ok);
}
.preview.no { border-color: var(--no-line); background: var(--no); }
.ghost {
  position: fixed;
  z-index: 70;
  pointer-events: none;
  border-radius: 6px;
  padding: 3px 6px;
  font-size: 0.78rem;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  opacity: 0.92;
  overflow: hidden;
}
body.dragging, body.dragging * { cursor: grabbing !important; }

/* ---------- armed bar, modal, toast ---------- */
.armed-bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 55;
  background: var(--ink);
  color: var(--bg);
  border-radius: 12px;
  padding: 8px 8px 8px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-lg);
  max-width: calc(100vw - 32px);
  font-size: 0.9rem;
}
.armed-bar button { background: transparent; color: inherit; border-color: currentColor; min-height: 32px; padding: 4px 10px; flex-shrink: 0; }

.modal {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 80;
  padding: 16px;
}
.modal-card {
  background: var(--surface);
  color: var(--ink);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  width: min(440px, 100%);
  max-height: calc(100% - 16px);
  overflow-y: auto;
  padding: 18px 18px 16px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.modal-card h3 { margin: 0; font-family: var(--hand-title); font-weight: 700; font-size: 1.6rem; line-height: 1.1; display: flex; align-items: center; gap: 8px; padding-right: 36px; }
.modal-card h3 .sw { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
.modal-x { position: absolute; top: 10px; right: 10px; border: none; background: transparent; font-size: 1.4rem; line-height: 1; min-height: 32px; padding: 2px 8px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper output { min-width: 6ch; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.stepper button { width: 42px; font-size: 1.1rem; }
.btn-row { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.btn-row .end { display: flex; gap: 8px; margin-left: auto; }
.timer-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.timer-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.timer-row input { width: 72px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
.timer-display { font-size: 2.8rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.timer-done { font-weight: 700; color: var(--danger); text-align: center; margin: 0; }
.quote { font-size: 1.1rem; margin: 0; }
.type-list { display: flex; flex-direction: column; gap: 6px; }
.type-row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.type-row .sw { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
.type-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.type-row .tag { font-size: 0.72rem; color: var(--muted); }
.type-row.archived .nm { color: var(--muted); text-decoration: line-through; }
.type-row button { min-height: 30px; padding: 3px 10px; font-size: 0.82rem; }
.new-type { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
.new-type input[type="color"] { width: 44px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.pal-list { display: flex; flex-direction: column; gap: 6px; }
.pal-opt { display: flex; align-items: center; gap: 12px; justify-content: space-between; text-align: left; padding: 8px 12px; min-height: 48px; }
.pal-opt[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--surface-2); }
.pal-opt .nm { font-size: 1.05rem; }
.dots { display: flex; }
.dots i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -5px; display: block; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 8px 28px; }
.swatches button { width: 28px; height: 28px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.type-row .sw-btn { width: 22px; height: 22px; min-height: 0; padding: 0; border-radius: 6px; flex-shrink: 0; }
/* entregas */
.tbadge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 0.8rem; }
.tbadge.late { background: var(--no-line); color: #fff; }
.due-count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; font-size: 0.75rem; background: var(--accent); color: var(--accent-ink); }
.due-count.soon { background: var(--warn); color: #fff; }
.due-count.late { background: var(--no-line); color: #fff; }
.due {
  --due-c: var(--accent);
  position: absolute;
  left: 3px;
  right: 3px;
  z-index: 4;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 0;
  padding: 1px 7px;

// ---------- dates ----------

// ---------- collisions ----------
function overlaps(a, b) {
  if (a.day !== b.day) return false;
  const a0 = slotStartMin(a.slot), a1 = a0 + a.minutes;
  const b0 = slotStartMin(b.slot), b1 = b0 + b.minutes;

}

  return !collides({ day, slot, minutes }, ignoreId);
}

// ---------- tracking helpers ----------
// Tipos sem prioridade escolhida ganham uma pelo nome; dá pra trocar em Tipos…
function catOf(t) {
  if (!t || t === FALLBACK_TYPE) return "";
  if (typeof t.cat === "string") return t.cat;
  const n = String(t.name || "").toLowerCase();
  if (/codelabs/.test(n)) return "codelabs";
  if (/\b(ic|ds)\b|data science|ciência de dados|probabilidade|cenipa|python/.test(n)) return "ds";
  if (/^estudo/.test(n) || ["estudo", "estudo-bonus", "minimo", "abertura"].includes(t.kind)) return "grad";
  return "";
}
function blockCat(b) { return catOf(typeById(b.typeId)); }
function tracked(b) { return CATS.some((c) => c.id === blockCat(b)); }
function blockEndMin(b) { return slotStartMin(b.slot) + b.minutes; }
function blockStarted(wk, b, ln = logicalNow()) {
  if (wk !== ln.week) return wk < ln.week;
  if (b.day !== ln.day) return b.day < ln.day;
  return slotStartMin(b.slot) <= ln.min;
}
function blockEnded(wk, b, ln = logicalNow()) {
  if (wk !== ln.week) return wk < ln.week;
  if (b.day !== ln.day) return b.day < ln.day;
  return blockEndMin(b) <= ln.min;
}
// Blocos desta semana que já terminaram e ainda não têm registro.
function pendingBlocks(ln = logicalNow()) {

  return blocksOf(ln.week).filter((b) => tracked(b) && !b.log && blockEnded(ln.week, b, ln));
}
function fmtH(min) {

  return (Number.isInteger(v) ? String(v) : v.toFixed(1).replace(".", ",")) + "h";
}
function studyStats(wk = state.weekStart) {
  let planned = 0, done = 0;
  for (const b of blocksOf(wk)) {
    if (!tracked(b)) continue;

}
function setLog(wk, id, patch) {

  if (!b) return null;

  } else {
    const next = { ...(b.log || {}), ...patch, at: new Date().toISOString() };
    if (next.s !== "pulei" && next.s !== "parcial") delete next.r;
    if (next.s !== "troquei") delete next.to;

}

// ---------- persistence ----------
const writers = {};
const stash = {};
let writeError = false;

function saveTypes() { persist("config/types", () => ({ types: state.types, palette: state.palette })); }

function persist(path, bodyFn) {
  if (mode === "local") { saveLocal(); return; }
  if (mode !== "sync") return;
  delete stash[path];
  const w = writers[path] || (writers[path] = { busy: false, pending: null });
  w.pending = clone(bodyFn());
  writeCache();
  if (!w.busy) flush(path, w);
}
async function flush(path, w) {
  w.busy = true;
  setSync("saving");
  while (w.pending) {
    const body = w.pending;
    w.pending = null;
    try {
      await setWithRetry(path, body);
      writeError = false;
    } catch (e) {
      onWriteError(e);
    }
  }
  w.busy = false;
  if (!Object.values(writers).some((x) => x.busy)) setSync(readonly ? "readonly" : writeError ? "error" : "ok");
  applyStash(path);
}
async function setWithRetry(path, body) {
  try {
    await db.doc(path).set(body);
  } catch (e) {
    if (e && e.code === "unavailable") {

      return db.doc(path).set(body);
    }
    throw e;
  }
}
function onWriteError(e) {
  const code = e && e.code;
  if (code === "invalid_argument") {
    readonly = true;
    setSync("readonly");
    toast("Você não tem permissão pra editar este quadro.");
  } else if (code === "quota_exceeded") {
    writeError = true;
    toast("O espaço do quadro encheu. Apague semanas antigas pra liberar.");
  } else {
    writeError = true;
    toast("Não consegui salvar. Confira a internet: a mudança fica na tela, mas pode não chegar nos outros aparelhos.");
  }
}
function saveLocal() {
  lsSet(LOCAL_KEY, { weekStart: state.weekStart, types: state.types, weeks: state.weeks, palette: state.palette, tasks: state.tasks });
}

  const data = lsGet(LOCAL_KEY);

  state.types = mergeBuiltins(data.types);
  state.weeks = data.weeks || {};
  state.palette = typeof data.palette === "string" ? data.palette : null;
  state.tasks = Array.isArray(data.tasks) ? data.tasks : [];
}

// ---------- sync subscriptions ----------
let unsubWeek = null;
let subscribedWeek = null;

function applySnap(path, snap) {
  const w = writers[path];
  if (w && (w.busy || w.pending)) return;          // our own write is in flight; it wins
  if (interacting) { stash[path] = snap; return; }  // wait until the drag/resize ends
  if (path === "config/types") {
    const d = snap.exists ? snap.data() : null;
    state.types = mergeBuiltins(d && Array.isArray(d.types) ? clone(d.types) : null);
    state.palette = d && typeof d.palette === "string" ? d.palette : null;
    typesReady = true;
    applyChrome();
    maybeAutoPalette();
  } else {
    const wk = path.slice("weeks/".length);
    const d = snap.exists ? snap.data() : null;
    state.weeks[wk] = d && Array.isArray(d.blocks) ? clone(d.blocks) : [];
    weekReady[wk] = true;
    (weekWaiters[wk] || []).splice(0).forEach((r) => r());
  }
  if (typesReady && weekReady[state.weekStart] && !readonly && !Object.values(writers).some((x) => x.busy)) setSync(writeError ? "error" : "ok");
  writeCache();

}

    (snap) => applySnap("config/types", snap),
    (e) => onSubError(e)

    (snap) => applySnap("weeks/" + wk, snap),
    (e) => onSubError(e)

const SYNC_TEXT = {

function setSync(s) { const n = $("#sync"); n.dataset.s = s; n.textContent = SYNC_TEXT[s]; }

// ---------- actions ----------
function placeBlock(typeId, day, slot, extra = {}) {
  if (!editable()) return null;
  const t = typeById(typeId);
  if (!t) return null;
  const minutes = extra.minutes ?? defaultMinutes(t);
  if (slotStartMin(slot) + minutes > END_MIN) { toast("Não cabe antes da 01:30."); return null; }
  if (collides({ day, slot, minutes })) { toast("Esse horário já está ocupado."); return null; }
  const block = { id: uid(), typeId, day, slot, minutes, text: extra.text ?? t.name };
  currentBlocks().push(block);
  saveWeek();
  render();
  return block;
}
function moveBlockTo(id, day, slot) {
  const b = currentBlocks().find((x) => x.id === id);
  if (!b) return false;
  if (!fits(day, slot, b.minutes, id)) { toast("Esse horário já está ocupado."); return false; }
  b.day = day; b.slot = slot;
  saveWeek();
  render();
  return true;
}
function removeBlock(id) {
  const list = currentBlocks();
  const i = list.findIndex((b) => b.id === id);

async function addMinimoViavel() {
  const ln = logicalNow();
  if (ln.min >= END_MIN) { toast("Já passou da 01:30. O mínimo viável fica pra amanhã."); return; }
  if (state.weekStart !== ln.week) goToWeek(ln.week);
  state.selDay = ln.day;
  await whenWeekReady(ln.week);
  if (!editable()) return;
  const minutes = MINIMO_TYPE.defaultMinutes;
  const first = Math.ceil((ln.min - START_MIN) / SLOT_MIN);
  let found = -1;
  for (let s = Math.max(0, first); s < NUM_SLOTS; s++) {
    if (fits(ln.day, s, minutes, null)) { found = s; break; }
  }
  if (found < 0) { toast("Não há horário livre hoje depois de agora."); render(); return; }
  if (!typeById(MINIMO_TYPE.id)) {
    const t = clone(MINIMO_TYPE);
    if (state.palette) setTypeColor(t, nextTone());
    state.types.push(t);
    saveTypes();
  }
  const b = placeBlock(MINIMO_TYPE.id, ln.day, found, { minutes, text: "Mínimo viável ✓" });
  if (b) { toast(`Mínimo viável às ${slotLabel(found)}.`); scrollToMin(slotStartMin(found)); }
}

async function duplicateWeek() {
  if (!editable()) return;
  const src = currentBlocks();
  if (!src.length) { toast("Esta semana está vazia."); return; }
  const next = addDays(state.weekStart, 7);
  let dest;
  try { dest = await readWeek(next); } catch { toast("Não consegui ler a próxima semana. Tente de novo."); return; }
  if (dest.length) {
    const ok = await confirmBox(
      "A próxima semana já tem blocos",
      `A semana de ${weekLabel(next)} tem ${dest.length} bloco(s). Substituir tudo pela cópia desta?`,
      "Substituir"
    );
    if (!ok) return;
  }
  // a cópia leva o plano, não os registros de como foi
  state.weeks[next] = src.map(({ log, ...b }) => ({ ...b, id: uid() }));
  saveWeek(next);
  toast("Semana duplicada. Use → para ver a próxima.");
}

async function allWeeks() {
  if (mode !== "sync") return state.weeks;
  const snap = await db.collection("weeks").get();
  const out = {};
  for (const d of snap.docs) {
    const body = d.data();
    if (body && Array.isArray(body.blocks) && body.blocks.length) out[d.id] = clone(body.blocks);

function importFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); } catch { toast("Esse arquivo não é um JSON válido."); return; }
    let weeks = null;
    if (data.weeks && typeof data.weeks === "object") weeks = data.weeks;
    else if (Array.isArray(data.currentWeekBlocks) && data.weekStart) weeks = { [data.weekStart]: data.currentWeekBlocks };
    else if (Array.isArray(data.blocks) && data.weekStart) weeks = { [data.weekStart]: data.blocks };
    const incomingTasks = Array.isArray(data.tasks) ? data.tasks.filter((t) => t && t.id && t.title && t.due) : [];
    if (!weeks && !incomingTasks.length) { toast("Não achei blocos nem entregas nesse arquivo."); return; }
    const incoming = Object.entries(weeks || {}).filter(([, v]) => Array.isArray(v) && v.length);
    let conflicts = [];
    try {
      for (const [wk, blocks] of incoming) {
        const cur = await readWeek(wk);
        if (cur.length && JSON.stringify(cur) !== JSON.stringify(blocks)) conflicts.push(wk);
      }
    } catch { toast("Não consegui comparar com o que já está salvo. Tente de novo."); return; }
    if (conflicts.length) {
      const ok = await confirmBox(
        "Substituir semanas?",
        `O arquivo tem ${incoming.length} semana(s). ${conflicts.length === 1 ? "Esta já tem" : "Estas já têm"} blocos diferentes aqui e ${conflicts.length === 1 ? "vai ser substituída" : "vão ser substituídas"}: ${conflicts.map(weekLabel).join("; ")}. As outras semanas salvas continuam como estão.`,
        "Importar"
      );
      if (!ok) return;
    }
    if (Array.isArray(data.types)) {
      const byId = new Map(state.types.map((t) => [t.id, t]));
      for (const t of data.types) if (t && t.id) byId.set(t.id, { ...byId.get(t.id), ...t });
      state.types = mergeBuiltins([...byId.values()]);
      if (state.palette) recolorAll(state.palette); else saveTypes();
    }
    for (const [wk, blocks] of incoming) {
      state.weeks[wk] = clone(blocks);
      saveWeek(wk);
    }
    for (const t of incomingTasks) {
      const i = state.tasks.findIndex((x) => x.id === t.id);
      const rec = clone(t);
      if (i >= 0) state.tasks[i] = rec; else state.tasks.push(rec);
      saveTask(rec);
    }
    if (data.weekStart && incoming.length) goToWeek(data.weekStart); else render();
    toast(`Importado: ${incoming.length} semana(s)${incomingTasks.length ? ` e ${incomingTasks.length} entrega(s)` : ""}.`);
  };
  reader.readAsText(file);
}

  const daySel = h("select", { id: "sheet-day" }, DAY_FULL.map((d, i) => h("option", { value: i }, d)));
  daySel.value = String(b.day);
  const startSel = h("select", { id: "sheet-start" }, Array.from({ length: NUM_SLOTS }, (_, s) => h("option", { value: s }, slotLabel(s))));
  startSel.value = String(b.slot);
  const out = h("output", { id: "sheet-dur" }, fmtDur(minutes));
  const step = (d) => { minutes = clamp(minutes + d, STEP, END_MIN - START_MIN); out.textContent = fmtDur(minutes); };

  let extra = null;
  if (t.kind === "friccao") extra = frictionTimer();
  if (t.kind === "abertura") extra = h("p", { class: "quote" }, "Só abrir o caderno. Nenhuma meta além disso.");
  const rel = relatedTasks(t);
  const relBox = rel.length ? h("div", { class: "timer-box" },
    h("div", { class: "field" }, h("span", null, "Entregas dessa matéria")),
    rel.slice(0, 4).map((x) => h("button", { type: "button", class: "task-main rel-task " + urgency(x), onclick: () => openTaskEdit(x.id) },
      h("span", { class: "task-title" }, x.title),
      h("span", { class: "task-meta" }, `${fmtDue(x)} · ${dueRel(x)}`)))
  ) : null;

  const wk = state.weekStart;
  let logEl = null;
  if (tracked(b)) {
    logEl = blockStarted(wk, b)
      ? logControls(wk, b.id)
      : h("div", { class: "log-box" }, h("p", { class: "later" }, "Quando o bloco começar, dá pra registrar aqui como foi."));
  }

  const save = () => {
    if (readonly) { toast("Este quadro está só para leitura."); return; }
    const day = Number(daySel.value), slot = Number(startSel.value);
    if (slotStartMin(slot) + minutes > END_MIN) { toast("Não cabe: o quadro termina à 01:30."); return; }
    if (collides({ day, slot, minutes }, b.id)) { toast("Bate com outro bloco nesse horário."); return; }
    // o bloco pode ter sido recarregado do servidor enquanto a ficha estava aberta
    const cur = currentBlocks().find((x) => x.id === b.id);
    if (!cur) { toast("Esse bloco foi apagado em outro aparelho."); closeModal(); render(); return; }
    cur.text = text.value.trim() || t.name;
    cur.day = day; cur.slot = slot; cur.minutes = minutes;
    saveWeek();
    closeModal();
    render();
  };
  text.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); save(); } });

  openModal(h("div", { style: { display: "contents" } },
    h("h3", null, h("span", { class: "sw", style: { background: t.color } }), t.name),
    logEl,
    extra,
    relBox,
    h("label", { class: "field" }, h("span", null, "Texto"), text),
    h("div", { class: "row2" },
      h("label", { class: "field" }, h("span", null, "Dia"), daySel),
      h("label", { class: "field" }, h("span", null, "Início"), startSel)
    ),
    h("div", { class: "field" }, h("span", null, "Duração"),
      h("div", { class: "stepper" },
        h("button", { type: "button", "aria-label": "Menos 15 minutos", onclick: () => step(-STEP) }, "−"),
        out,
        h("button", { type: "button", "aria-label": "Mais 15 minutos", onclick: () => step(STEP) }, "+")
      )
    ),
    h("div", { class: "btn-row" },
      h("button", { type: "button", class: "danger", onclick: () => { if (readonly) return; removeBlock(b.id); closeModal(); } }, "Excluir"),
      h("div", { class: "end" },
        h("button", { type: "button", onclick: closeModal }, "Cancelar"),
        h("button", { type: "button", class: "accent", onclick: save }, "Salvar")
      )
    )
  ), stopTimer);
}

function frictionTimer() {
  let remaining = 20 * 60;
  const input = h("input", { type: "number", id: "timer-min", min: "1", max: "180", value: "20", inputmode: "numeric" });
  const display = h("div", { class: "timer-display" }, "20:00");
  const msg = h("div");
  const paint = () => {
    display.textContent = `${String(Math.floor(remaining / 60)).padStart(2, "0")}:${String(remaining % 60).padStart(2, "0")}`;
  };
  const start = () => {
    stopTimer();
    remaining = clamp(Number(input.value) || 20, 1, 180) * 60;
    msg.replaceChildren();
    paint();
    const endAt = Date.now() + remaining * 1000;
    timerInterval = setInterval(() => {
      remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      paint();
      if (remaining <= 0) {
        stopTimer();
        playBeep();
        msg.replaceChildren(h("p", { class: "timer-done" }, "Hora de fechar, sem negociar"));
      }
    }, 250);
  };
  return h("div", { class: "timer-box" },
    h("div", { class: "timer-row" },
      h("label", null, "Minutos ", input),
      h("button", { type: "button", class: "accent", onclick: start }, "Começar"),
      h("button", { type: "button", onclick: stopTimer }, "Parar")
    ),
    display,
    msg
  );
}
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [0, 0.35, 0.7].forEach((t) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square"; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(0.18, now + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.28);
      o.start(now + t); o.stop(now + t + 0.3);
    });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch (e) { console.warn(e); }
}

// ---------- tracking UI ----------
// Botões Feito / Não feito, com motivo opcional quando não rolou.
// Tocar de novo no botão marcado apaga o registro.
function logControls(wk, id, opts = {}) {
  const box = h("div", { class: opts.compact ? "chips-q" : "log-box" });
  const paint = () => {
    const b = blocksOf(wk).find((x) => x.id === id);
    if (!b) { box.replaceChildren(); return; }
    const log = b.log || {};
    const kids = [];
    if (!opts.compact) kids.push(h("div", { class: "chips-q" }, h("span", null, "Como foi?")));
    kids.push(h("div", { class: "st-seg", role: "group", "aria-label": "Como foi o bloco" }, STATUS.map((s) => h("button", {
      type: "button",
      "data-s": s.id,
      "aria-pressed": log.s === s.id ? "true" : "false",
      onclick: () => { setLog(wk, id, log.s === s.id ? null : { s: s.id }); paint(); },
    }, h("b", { "aria-hidden": "true" }, s.icon), s.label))));
    if (log.s === "pulei" || log.s === "parcial") {
      kids.push(h("div", { class: "chips-q" },
        h("span", null, log.s === "pulei" ? "Por que não rolou?" : "O que atrapalhou?"),
        h("div", { class: "rchips" }, REASONS.map((r) => h("button", {
          type: "button",
          "aria-pressed": log.r === r.id ? "true" : "false",
          onclick: () => { setLog(wk, id, { r: log.r === r.id ? null : r.id }); paint(); },
        }, r.label)))));
    }
    if (log.s === "troquei") {   // só aparece em registro antigo
      const own = blockCat(b);
      kids.push(h("div", { class: "chips-q" },
        h("span", null, "Estudou o quê no lugar?"),
        h("div", { class: "rchips" }, SWAP_TO.filter((o) => o.id !== own).map((o) => h("button", {
          type: "button",
          "aria-pressed": log.to === o.id ? "true" : "false",
          onclick: () => { setLog(wk, id, { to: log.to === o.id ? null : o.id }); paint(); },
        }, o.label)))));
    }
    box.replaceChildren(...kids);
  };
  paint();
  return box;
}

function dayLabel(d, ln) {
  if (d === ln.day) return "Hoje";
  if (d === ln.day - 1) return "Ontem";
  return DAY_FULL[d];
}

function openCheckin() {
  const ln = logicalNow();
  const list = pendingBlocks(ln).sort((a, b) => b.day - a.day || a.slot - b.slot);
  const body = h("div", { class: "ci-list" });
  if (!list.length) body.append(h("p", { class: "ci-empty" }, "Tudo registrado por enquanto."));
  let lastDay = -1;
  for (const b of list) {
    if (b.day !== lastDay) { lastDay = b.day; body.append(h("p", { class: "ci-day" }, dayLabel(b.day, ln))); }
    const t = typeOf(b.typeId);
    body.append(h("div", { class: "ci-row" },
      h("div", { class: "ci-top" },
        h("span", { class: "sw", style: { background: t.color } }),

  openModal(h("div", { style: { display: "contents" } },
    h("h3", null, "Como foram os blocos?"),
    h("p", { class: "muted" }, "Blocos de Graduação, DS/IC e CodeLabs que já passaram. Marque feito ou não feito; se não rolou, dá pra dizer o motivo. Tocar de novo no mesmo botão desfaz."),
    body,
    h("div", { class: "btn-row" },
      h("button", { type: "button", onclick: () => { closeModal(); openSummary(); } }, "Ver resumo"),

  ));

// ---------- tracking summary ----------
function pctLevel(p) { return p >= 70 ? "hi" : p >= 40 ? "mid" : "lo"; }
function meterRow(label, pct, note, fillClass) {
  return h("div", { class: "mrow" },
    h("span", { class: "lb" }, label),
    h("div", { class: "mtrack", role: "img", "aria-label": pct == null ? `${label}: sem registro` : `${label}: ${pct}%` },
      pct == null ? null : h("div", { class: "mfill " + (fillClass || pctLevel(pct)), style: { width: Math.max(2, pct) + "%" } })),
    h("span", { class: "pc" }, pct == null ? "–" : pct + "%"),
    note ? h("span", { class: "nt" }, note) : null);
}
function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }
function turnoOf(b) {
  const s = slotStartMin(b.slot);
  return s < 12 * 60 ? "manha" : s < 18 * 60 ? "tarde" : "noite";
}

async function openSummary() {
  const ln = logicalNow();
  const wk = state.weekStart;
  const sum = h("div", { class: "sum" }, h("p", { class: "sub" }, "Juntando os registros…"));
  openModal(h("div", { style: { display: "contents" } }, h("h3", null, "Tracking da rotina"), sum), null, "wide");
  let weeks;
  try { weeks = await allWeeks(); } catch {
    sum.replaceChildren(h("p", { class: "sub" }, "Não consegui ler as semanas salvas. Confira a internet e abra de novo."));
    return;
  }
  weeks = { ...weeks, [wk]: blocksOf(wk) };
  sum.replaceChildren(weekSection(wk, weeks[wk], ln), trendSection(weeks, ln),
    h("p", { class: "foot" }, "Como conta: feito vale 100%, não feito 0%. Registros antigos de parcial (50%) e troquei continuam contando como antes. Blocos sem registro ficam fora das porcentagens."));
}

function weekSection(wk, list, ln) {
  const sec = h("section", null, h("h4", null, `Semana de ${weekLabel(wk)}`));
  const by = {};
  for (const c of CATS) by[c.id] = { planned: 0, logged: 0, done: 0, pending: 0, future: 0, swappedIn: 0 };
  let effective = 0, anyTracked = false;
  for (const b of list || []) {
    const x = by[blockCat(b)];
    if (!x) continue;
    anyTracked = true;
    const st = b.log && statusById(b.log.s);
    if (!st && !blockEnded(wk, b, ln)) { x.future += b.minutes; continue; }
    if (!st) { x.pending++; continue; }
    x.logged += b.minutes;
    x.done += b.minutes * st.plan;
    effective += b.minutes * st.score;
    if (st.id === "troquei" && by[b.log.to]) by[b.log.to].swappedIn += b.minutes;
  }
  if (!anyTracked) {
    sec.append(h("p", { class: "sub" }, "Nenhum bloco de Graduação, DS/IC ou CodeLabs nessa semana. Escolha a prioridade de cada tipo em Tipos…"));
    return sec;
  }
  sec.append(h("p", { class: "sub" }, `Estudo que rendeu, contando trocas: ${fmtH(effective)}. Barras: quanto do plano de cada prioridade foi cumprido.`));
  for (const c of CATS) {
    const x = by[c.id];
    if (!x.logged && !x.pending && !x.future && !x.swappedIn) continue;
    const pct = x.logged ? Math.round((x.done / x.logged) * 100) : null;
    const bits = [];
    if (x.logged) bits.push(`${fmtH(x.done)} de ${fmtH(x.logged)} registradas`);
    if (x.pending) bits.push(plural(x.pending, "bloco sem registro", "blocos sem registro"));
    if (x.swappedIn) bits.push(`+${fmtH(x.swappedIn)} vindas de trocas`);
    if (x.future) bits.push(`${fmtH(x.future)} ainda por vir`);
    sec.append(meterRow(c.short, pct, bits.join(" · "), "c-" + c.id));
  }
  const pend = list.filter((b) => tracked(b) && !b.log && blockEnded(wk, b, ln)).length;
  if (pend && wk === ln.week) {
    sec.append(h("div", { class: "btn-row" }, h("span"), h("button", { type: "button", class: "go", onclick: () => { closeModal(); openCheckin(); } }, `Registrar ${plural(pend, "bloco", "blocos")}`)));
  }
  return sec;
}

function trendSection(weeks, ln) {
  const from = addDays(ln.week, -21);
  const logs = [];
  for (const [k, list] of Object.entries(weeks)) {
    if (k < from || k > ln.week) continue;
    for (const b of list || []) {
      const st = b.log && statusById(b.log.s);
      if (!st || !tracked(b)) continue;
      logs.push({ wk: k, b, st, cat: blockCat(b) });
    }
  }
  const sec = h("section", null, h("h4", null, "Últimas 4 semanas"));
  if (!logs.length) {
    sec.append(h("p", { class: "sub" }, "Ainda não tem registro. Toque num bloco que já passou e marque feito ou não feito, ou use o botão Registrar na faixa de cima. Com uma ou duas semanas de registro aparecem os padrões: que turno rende, que tamanho de bloco funciona e o que mais atrapalha."));
    return sec;
  }
  const agg = (keyFn, valFn = (l) => l.st.score) => {
    const m = new Map();
    for (const l of logs) {
      const k = keyFn(l);
      if (k == null) continue;
      const x = m.get(k) || { n: 0, sum: 0 };
      x.n++; x.sum += valFn(l);
      m.set(k, x);
    }
    for (const x of m.values()) x.pct = Math.round((x.sum / x.n) * 100);
    return m;
  };
  const byTurno = agg((l) => turnoOf(l.b));
  const byDay = agg((l) => l.b.day);
  const byDur = agg((l) => (l.b.minutes <= 90 ? "curto" : "longo"));
  const byCat = agg((l) => l.cat, (l) => l.st.plan);
  const byWeek = agg((l) => l.wk);
  const reasons = new Map(), swaps = new Map();
  for (const l of logs) {
    if (l.b.log.r) reasons.set(l.b.log.r, (reasons.get(l.b.log.r) || 0) + 1);
    if (l.st.id === "troquei" && l.b.log.to) { const k = l.cat + ">" + l.b.log.to; swaps.set(k, (swaps.get(k) || 0) + 1); }
  }

  // frases com o que os números mostram
  const ins = [];
  const turnos = TURNOS.map((t) => ({ ...t, ...(byTurno.get(t.id) || {}) })).filter((t) => t.n >= 3).sort((a, b) => a.pct - b.pct);
  if (turnos.length >= 2) {
    const lo = turnos[0], hi = turnos[turnos.length - 1];
    if (hi.pct - lo.pct >= 20) ins.push(`Seus blocos ${hi.da} rendem ${hi.pct}%; os ${lo.da}, ${lo.pct}%.`);
  }
  const cu = byDur.get("curto"), lg = byDur.get("longo");
  if (cu && lg && cu.n >= 3 && lg.n >= 3 && Math.abs(cu.pct - lg.pct) >= 20) ins.push(`Blocos de até 1h30 rendem ${cu.pct}%; os de mais de 1h30, ${lg.pct}%.`);
  const topR = [...reasons.entries()].sort((a, b) => b[1] - a[1])[0];
  if (topR && topR[1] >= 2) ins.push(`O que mais atrapalha: ${REASONS.find((r) => r.id === topR[0]).label.toLowerCase()} (${topR[1]}x).`);
  const topS = [...swaps.entries()].sort((a, b) => b[1] - a[1])[0];
  if (topS && topS[1] >= 2) {
    const [f, t] = topS[0].split(">");
    ins.push(`${topS[1]} blocos de ${CAT_NAME[f]} viraram ${CAT_NAME[t]}.` + (t !== "outro" ? ` Talvez ${CAT_NAME[t]} precise de mais horário fixo.` : ""));
  }
  if (logs.length < 10) ins.push(`Com uns 10 blocos registrados os padrões ficam confiáveis. Por enquanto são ${logs.length}.`);
  if (ins.length) sec.append(h("ul", { class: "insights" }, ins.map((t) => h("li", null, t))));

  const grid = h("div", { class: "sum-grid" });
  const box = (title, sub, rows) => h("section", null, h("h4", null, title), sub ? h("p", { class: "sub" }, sub) : null, rows);
  const n = (x) => plural(x.n, "bloco", "blocos");

  grid.append(box("Por turno", "Quanto os blocos renderam.",
    TURNOS.filter((t) => byTurno.has(t.id)).map((t) => { const x = byTurno.get(t.id); return meterRow(t.label, x.pct, n(x)); })));
  grid.append(box("Por dia", null,
    DAY_FULL.map((d, i) => [d, byDay.get(i)]).filter(([, x]) => x).map(([d, x]) => meterRow(d, x.pct, n(x)))));
  grid.append(box("Tamanho do bloco", null,
    [["curto", "Até 1h30"], ["longo", "Mais de 1h30"]].filter(([k]) => byDur.has(k)).map(([k, lb]) => { const x = byDur.get(k); return meterRow(lb, x.pct, n(x)); })));
  grid.append(box("Plano por prioridade", "Quanto foi feito do que estava planejado.",
    CATS.filter((c) => byCat.has(c.id)).map((c) => { const x = byCat.get(c.id); return meterRow(c.short, x.pct, n(x), "c-" + c.id); })));
  const weekRows = [...byWeek.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)).map(([k, x]) => {
    const d = parseIso(k);
    return meterRow(`${d.getDate()}/${d.getMonth() + 1}`, x.pct, n(x));
  });
  grid.append(box("Semana a semana", "Semanas começando na segunda.", weekRows));
  const rList = [...reasons.entries()].sort((a, b) => b[1] - a[1]).map(([id, c]) => h("div", { class: "kv" }, h("span", null, REASONS.find((r) => r.id === id).label), h("span", null, c + "x")));
  const sList = [...swaps.entries()].sort((a, b) => b[1] - a[1]).map(([k, c]) => { const [f, t] = k.split(">"); return h("div", { class: "kv" }, h("span", null, `${CAT_NAME[f]} → ${CAT_NAME[t]}`), h("span", null, c + "x")); });
  grid.append(box("Motivos e trocas", null,
    rList.length || sList.length ? [...rList, ...sList] : h("p", { class: "sub" }, "Nenhum bloco ficou sem fazer.")));
  sec.append(grid);
  return sec;
}

// ---------- types sheet ----------
// ---------- entregas ----------
// Cada entrega é um documento em tasks/<id>: { title, typeId, due: "AAAA-MM-DDTHH:MM", done, doneAt, createdAt }.
const MONTHS = { jan: 0, fev: 1, mar: 2, abr: 3, mai: 4, jun: 5, jul: 6, ago: 7, set: 8, out: 9, nov: 10, dez: 11 };
const WEEKDAY_SHORT = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
let lastSubject = "";

function pad2(n) { return String(n).padStart(2, "0"); }
function taskDate(t) {
  const [d, tm] = String(t.due).split("T");
  const [y, m, dd] = d.split("-").map(Number);
  const [hh, mi] = (tm || "23:59").split(":").map(Number);
  return new Date(y, m - 1, dd, hh, mi);
}
// vencimento à meia-noite (ou de madrugada) aparece no fim do dia anterior, como o resto do quadro
function taskLogical(t) {
  const dt = taskDate(t);
  let min = dt.getHours() * 60 + dt.getMinutes();
  const d = new Date(dt);
  if (min < START_MIN) { d.setDate(d.getDate() - 1); min += 1440; }
  return { week: mondayKey(d), day: (d.getDay() + 6) % 7, min };
}
function fmtDue(t) {
  const d = taskDate(t);
  return `${WEEKDAY_SHORT[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}, ${hhmm(d.getHours() * 60 + d.getMinutes())}`;
}
function dueRel(t) {
  const ms = taskDate(t) - Date.now();
  const m = Math.round(Math.abs(ms) / 60000);
  const txt = m < 60 ? `${m} min` : m < 48 * 60 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)} dias`;
  return ms < 0 ? `atrasada há ${txt}` : `faltam ${txt}`;
}
function urgency(t) {
  if (t.done) return "done";
  const ms = taskDate(t) - Date.now();
  if (ms < 0) return "late";
  if (ms < 2 * 86400000) return "soon";
  return "later";
}
function pendingTasks() { return state.tasks.filter((t) => !t.done).sort((a, b) => taskDate(a) - taskDate(b)); }
function norm(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
// "Estudo - ICC2" também mostra as entregas marcadas como ICC2
function relatedTasks(type) {
  const tn = norm(type.name);
  return pendingTasks().filter((x) => {
    if (!x.typeId) return false;
    if (x.typeId === type.id) return true;
    const st = typeById(x.typeId);
    const sn = st ? norm(st.name) : "";
    return sn.length >= 2 && tn.includes(sn);
  });
}
function saveTask(t) {
  persist("tasks/" + t.id, () => { const { id, ...body } = t; return body; });
}
async function deleteTask(id) {
  state.tasks = state.tasks.filter((t) => t.id !== id);
  render();
  if (mode === "local") { saveLocal(); return; }
  if (mode !== "sync") return;
  const path = "tasks/" + id;
  const w = writers[path];
  if (w) { w.pending = null; while (w.busy) await sleep(100); }
  try { await db.doc(path).delete(); } catch (e) { onWriteError(e); }
  writeCache();
}
function subscribeTasks() {
  db.collection("tasks").onSnapshot(
    (snap) => { if (interacting) { stash.__tasks = snap; return; } applyTasks(snap); },

function applyTasks(snap) {

  // mudanças que ainda estão sendo salvas valem mais que o retrato do servidor
  for (const [id, t] of local) {

// Lê o texto copiado da página de tarefas do Moodle:
//   Tarefa 4 - Algoritmos de Busca & Hash
//   Aberto: sexta-feira, 9 out. 2026, 00:00  Vencimento: segunda-feira, 26 out. 2026, 23:59
function parseMoodle(text) {
  const dateRe = /(\d{1,2})\s*(?:de\s+)?([a-zç]{3})[a-zç]*\.?(?:\s*(?:de\s+)?(\d{4}))?,?\s*(?:às\s*)?(\d{1,2}):(\d{2})/i;
  const out = [];
  let title = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.replace(/\s+/g, " ").trim();
    if (!line) continue;
    const vi = line.search(/vencimento|prazo final|data de entrega|data limite|due/i);
    if (vi >= 0) {
      const m = line.slice(vi).match(dateRe);
      const mo = m ? MONTHS[norm(m[2]).slice(0, 3)] : undefined;
      if (m && title && mo !== undefined) {
        const now = new Date();
        let year = m[3] ? Number(m[3]) : now.getFullYear();
        if (!m[3] && new Date(year, mo, Number(m[1])) < new Date(now.getFullYear(), now.getMonth() - 2, 1)) year += 1;
        out.push({ title, due: `${year}-${pad2(mo + 1)}-${pad2(m[1])}T${pad2(m[4])}:${m[5]}` });
        title = null;
      }
      continue;
    }
    if (/^(aberto|aberta|abre|opened|opens|disponível|disponivel)\b/i.test(line)) continue;
    if (/^(marcar como feito|feito|concluído|concluido|a fazer)$/i.test(line)) continue;
    title = line;
  }
  return out;
}

// ---------- palettes ----------
function applyChrome() {
  const root = document.documentElement.style;
  if (!state.palette) {
    ["--pal-accent", "--pal-accent-2", "--pal-soft", "--pal-accent-d", "--pal-accent-d2", "--pal-soft-d"].forEach((k) => root.removeProperty(k));
    return;
  }
  const p = paletteById(state.palette);
  // a cor mais escura (e com alguma cor) da paleta vira o destaque da interface
  const colorful = p.colors.filter((c) => hexToHsl(c)[1] > 25);
  const base = [...(colorful.length ? colorful : p.colors)].sort((a, b) => hexToHsl(a)[2] - hexToHsl(b)[2])[0];
  const [hh, s] = hexToHsl(base);
  const sat = Math.max(38, Math.min(70, s));
  root.setProperty("--pal-accent", hslToHex(hh, sat, 40));
  root.setProperty("--pal-accent-2", hslToHex(hh, sat, 33));
  root.setProperty("--pal-soft", hslToHex(hh, sat, 92));
  root.setProperty("--pal-accent-d", hslToHex(hh, sat, 72));
  root.setProperty("--pal-accent-d2", hslToHex(hh, sat, 80));
  root.setProperty("--pal-soft-d", hslToHex(hh, Math.min(sat, 40), 20));
}
// Recolore todos os tipos. Tipos que tinham a mesma cor continuam juntos numa cor nova;
// "Estudo bônus" vira uma versão clara do "Estudo confiável".
// Os grupos que mais ocupam a semana ficam com os tons mais suaves.
function recolorAll(pid) {
  const tones = paletteTones(paletteById(pid));
  const keyOf = (t) => String(t.color || "").toLowerCase();
  const minutesByType = {};
  for (const list of Object.values(state.weeks)) for (const b of list || []) minutesByType[b.typeId] = (minutesByType[b.typeId] || 0) + b.minutes;
  const groups = new Map();
  for (const t of state.types) {
    if (t.kind === "estudo-bonus") continue;
    const k = keyOf(t);
    if (!groups.has(k)) groups.set(k, { order: groups.size, minutes: 0, types: [] });
    const g = groups.get(k);
    g.minutes += minutesByType[t.id] || 0;
    g.types.push(t);
  }
  [...groups.values()]
    .sort((a, b) => b.minutes - a.minutes || a.order - b.order)
    .forEach((g, i) => g.types.forEach((t) => setTypeColor(t, tones[i % tones.length])));
  const estudo = state.types.find((t) => t.kind === "estudo");
  const bonus = state.types.find((t) => t.kind === "estudo-bonus");
  if (bonus) setTypeColor(bonus, shade(estudo ? estudo.color : tones[0], 26, -8));
  state.palette = pid;
  saveTypes();
  applyChrome();
  render();
}
function maybeAutoPalette() {
  if (autoPaletteDone || state.palette || readonly) return;
  autoPaletteDone = true;
  setTimeout(() => recolorAll(DEFAULT_PALETTE), 0);

  const tones = paletteTones(paletteById(state.palette || DEFAULT_PALETTE));

// ---------- gestures: tap vs drag (mouse drags at once, touch after a long press) ----------
let drag = null;

function gesture(node, { onTap, onDrag }) {
  node.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || drag) return;
    const touch = e.pointerType !== "mouse";
    const sx = e.clientX, sy = e.clientY;
    let lx = sx, ly = sy, started = false, dead = false, timer = null;
    const begin = () => { started = true; onDrag({ clientX: lx, clientY: ly }); };
    if (touch) {
      timer = setTimeout(() => {
        if (dead) return;
        if (navigator.vibrate) navigator.vibrate(12);
        begin();
      }, 380);
    }
    const move = (ev) => {
      lx = ev.clientX; ly = ev.clientY;
      if (started) { dragMove(ev); return; }
      const d = Math.hypot(lx - sx, ly - sy);
      if (touch) { if (d > 9) { dead = true; clearTimeout(timer); } }
      else if (d > 5) { begin(); dragMove(ev); }
    };
    const up = (ev) => {
      cleanup();
      if (started) dragEnd(ev);
      else if (!dead) onTap(ev);
    };
    const cancel = () => { cleanup(); if (started) dragCancel(); };
    const cleanup = () => {
      clearTimeout(timer);
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", cancel);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", cancel);
  });
  node.addEventListener("contextmenu", (e) => e.preventDefault());
}
window.addEventListener("touchmove", (e) => { if (drag || resizing) e.preventDefault(); }, { passive: false });

function slotH() { return state.view === "day" ? 34 : 28; }

function startDrag(opts, ev) {
  if (!editable()) return;
  const t = typeOf(opts.typeId);
  const H = slotH();
  const col = document.querySelector(".day-slots");
  const width = col ? col.getBoundingClientRect().width - 6 : 140;
  const ghost = h("div", { class: "ghost" + (t.hatch ? " hatch" : "") }, opts.label);
  Object.assign(ghost.style, {
    width: width + "px",
    height: Math.max(12, (opts.minutes / SLOT_MIN) * H - 2) + "px",
    background: t.color, border: t.border, color: t.textColor || "#111",
  });
  document.body.append(ghost);
  drag = { ...opts, ghost, x: ev.clientX, y: ev.clientY, target: null, preview: null, grabX: opts.grabX ?? width / 2, grabY: opts.grabY ?? H / 2 };
  interacting = true;
  document.body.classList.add("dragging");
  if (opts.node) opts.node.classList.add("lifted");
  dragMove(ev);
  drag.raf = requestAnimationFrame(autoscroll);
}
function dragMove(ev) {
  if (!drag) return;
  drag.x = ev.clientX; drag.y = ev.clientY;
  drag.ghost.style.left = drag.x - drag.grabX + "px";
  drag.ghost.style.top = drag.y - drag.grabY + "px";
  computeTarget();
}
function computeTarget() {
  const el = document.elementFromPoint(drag.x, drag.y);
  const wrap = el && el.closest(".day-slots");
  if (drag.preview) { drag.preview.remove(); drag.preview = null; }
  if (!wrap) { drag.target = null; drag.ghost.style.visibility = "visible"; return; }
  const H = slotH();
  const day = Number(wrap.dataset.day);
  const top = wrap.getBoundingClientRect().top;
  const slot = clamp(Math.round((drag.y - drag.grabY - top) / H), 0, NUM_SLOTS - 1);
  const ok = fits(day, slot, drag.minutes, drag.blockId || null);
  drag.target = { day, slot, ok };
  const p = h("div", { class: "preview" + (ok ? "" : " no") });
  p.style.top = slot * H + 1 + "px";
  p.style.height = Math.max(10, (drag.minutes / SLOT_MIN) * H - 2) + "px";
  wrap.append(p);
  drag.preview = p;
  drag.ghost.style.visibility = "hidden";
}
function autoscroll() {
  if (!drag) return;
  const sc = $("#scroller");
  const r = sc.getBoundingClientRect();
  const edge = 44;
  if (drag.x >= r.left && drag.x <= r.right && drag.y >= r.top && drag.y <= r.bottom) {
    let dx = 0, dy = 0;
    if (drag.y < r.top + 42 + edge) dy = -10; else if (drag.y > r.bottom - edge) dy = 10;
    if (drag.x < r.left + edge + 40) dx = -10; else if (drag.x > r.right - edge) dx = 10;
    if (dx || dy) {
      const bx = sc.scrollLeft, by = sc.scrollTop;
      sc.scrollBy(dx, dy);
      if (sc.scrollLeft !== bx || sc.scrollTop !== by) computeTarget();
    }
  }
  drag.raf = requestAnimationFrame(autoscroll);
}
function endDragCommon() {
  cancelAnimationFrame(drag.raf);
  drag.ghost.remove();
  if (drag.preview) drag.preview.remove();
  if (drag.node) drag.node.classList.remove("lifted");
  document.body.classList.remove("dragging");
  const d = drag;
  drag = null;
  interacting = false;
  return d;
}
function dragEnd() {
  if (!drag) return;
  const d = endDragCommon();
  const tg = d.target;
  applyAllStash();
  if (!tg) { render(); return; }
  if (!tg.ok) { toast("Esse horário já está ocupado."); render(); return; }
  if (d.kind === "new") placeBlock(d.typeId, tg.day, tg.slot);
  else moveBlockTo(d.blockId, tg.day, tg.slot);
}
function dragCancel() {
  if (!drag) return;
  endDragCommon();
  applyAllStash();
  render();
}

// ---------- resize ----------
let resizing = false;
function startResize(e, b, node) {
  e.preventDefault();
  e.stopPropagation();
  if (!editable()) return;
  const handle = e.currentTarget;
  try { handle.setPointerCapture(e.pointerId); } catch {}
  const H = slotH();
  const sy = e.clientY, sm = b.minutes;
  let cur = sm;
  resizing = true; interacting = true;
  node.classList.add("resizing");
  const range = node.querySelector(".br");
  const move = (ev) => {
    let m = Math.round((sm + ((ev.clientY - sy) / H) * SLOT_MIN) / STEP) * STEP;
    m = clamp(m, STEP, END_MIN - slotStartMin(b.slot));
    if (m === cur || collides({ ...b, minutes: m }, b.id)) return;
    cur = m;
    node.style.height = Math.max(10, (m / SLOT_MIN) * H - 2) + "px";
    if (range) range.textContent = `${hhmm(slotStartMin(b.slot))}–${hhmm(slotStartMin(b.slot) + m)}`;
  };
  const up = () => {
    handle.removeEventListener("pointermove", move);
    handle.removeEventListener("pointerup", up);
    handle.removeEventListener("pointercancel", up);
    resizing = false; interacting = false;
    if (cur !== sm) { b.minutes = cur; saveWeek(); }
    applyAllStash();
    render();
  };
  handle.addEventListener("pointermove", move);
  handle.addEventListener("pointerup", up);
  handle.addEventListener("pointercancel", up);
}

// ---------- arm (tap a type, then tap a slot) ----------
function arm(id) {
  if (armedType === id) { disarm(); return; }
  armedType = id;
  const t = typeById(id);
  $("#armed-text").textContent = `Toque num horário para colocar “${t.name}”.`;
  $("#armed").hidden = false;
  document.body.classList.add("armed");
  renderPalette();
}
function disarm() {
  armedType = null;
  $("#armed").hidden = true;
  document.body.classList.remove("armed");
  renderPalette();
}

// ---------- render ----------
function render() {
  if (drag || resizing) return;
  $("#week-label").textContent = weekLabel(state.weekStart);
  const ss = studyStats();
  const pend = pendingBlocks().length;
  const pill = $("#study");
  pill.replaceChildren(...(pend ? [h("span", { class: "pdot", "aria-hidden": "true" })] : []), `Estudo: ${fmtH(ss.done)} de ${fmtH(ss.planned)}`);
  pill.title = pend ? `${pend} bloco${pend > 1 ? "s" : ""} sem registro. Toque pra ver o resumo.` : "Horas de estudo que renderam, de quantas foram planejadas. Toque pra ver o resumo.";
  renderTasksBadge();
  renderPalette();
  renderBoardHead();
  renderCalendar();
  renderNow();
}

function renderPalette() {
  const wrap = $("#chips");
  wrap.replaceChildren(...state.types.filter((t) => !t.archived).map((t) => {
    const chip = h("button", { type: "button", class: "chip" + (t.hatch ? " hatch" : "") + (armedType === t.id ? " armed" : ""), "aria-pressed": armedType === t.id ? "true" : "false" }, t.name);
    Object.assign(chip.style, { background: t.color, border: t.border, color: t.textColor || "#111" });
    gesture(chip, {
      onTap: () => arm(t.id),
      onDrag: (ev) => startDrag({ kind: "new", typeId: t.id, minutes: defaultMinutes(t), label: t.name }, ev),
    });
    return chip;
  }));
}

function renderBoardHead() {
  $("#v-day").setAttribute("aria-pressed", state.view === "day");
  $("#v-week").setAttribute("aria-pressed", state.view === "week");
  const tabs = $("#day-tabs");
  tabs.hidden = state.view !== "day";
  const ln = logicalNow();
  tabs.replaceChildren(...DAY_NAMES.map((n, i) => {
    const d = parseIso(addDays(state.weekStart, i));
    const isToday = ln.week === state.weekStart && ln.day === i;
    return h("button", {
      type: "button",
      class: isToday ? "today" : "",
      "aria-pressed": state.selDay === i ? "true" : "false",
      onclick: () => { state.selDay = i; render(); },
    }, h("b", null, n), `${d.getDate()}/${d.getMonth() + 1}`);
  }));
}

function renderCalendar() {
  const cal = $("#calendar");
  const H = slotH();
  const days = state.view === "day" ? [state.selDay] : [0, 1, 2, 3, 4, 5, 6];
  const ln = logicalNow();
  const isCurWeek = ln.week === state.weekStart;
  cal.className = "calendar " + state.view;
  cal.style.setProperty("--slot-h", H + "px");
  cal.style.setProperty("--slots", NUM_SLOTS);
  cal.style.gridTemplateColumns = `var(--time-w) repeat(${days.length}, minmax(0, 1fr))`;

  const kids = [h("div", { class: "corner" })];
  for (const d of days) {
    const dt = parseIso(addDays(state.weekStart, d));
    kids.push(h("div", { class: "day-head" + (isCurWeek && d === ln.day ? " today" : "") },
      h("span", { class: "dn" }, state.view === "day" ? DAY_FULL[d] : DAY_NAMES[d]),
      h("span", { class: "dd" }, `${dt.getDate()}/${dt.getMonth() + 1}`),
      dueCount(d)));
  }
  const tc = h("div", { class: "time-col" });
  for (let s = 0; s < NUM_SLOTS; s += 2) tc.append(h("div", { class: "tl", style: { top: s * H + "px" } }, slotLabel(s)));
  kids.push(tc);

  const blocks = currentBlocks();
  for (const d of days) {
    const wrap = h("div", { class: "day-slots" + (isCurWeek && d === ln.day ? " today" : ""), "data-day": d });
    wrap.addEventListener("click", (e) => {
      if (!armedType || e.target !== wrap) return;
      const slot = clamp(Math.floor((e.clientY - wrap.getBoundingClientRect().top) / H), 0, NUM_SLOTS - 1);
      placeBlock(armedType, d, slot);
    });
    for (const b of blocks) if (b.day === d) wrap.append(renderBlock(b, H, isCurWeek && d === ln.day ? ln.min : null));
    wrap.append(...dueMarkers(d, H));
    kids.push(wrap);
  }
  cal.replaceChildren(...kids);
  renderNowLine();
}

function renderBlock(b, H, nowMin) {
  const t = typeOf(b.typeId);
  const height = Math.max(10, (b.minutes / SLOT_MIN) * H - 2);
  const s = slotStartMin(b.slot);
  const current = nowMin != null && nowMin >= s && nowMin < s + b.minutes;
  const isTracked = tracked(b);
  const st = isTracked && b.log ? statusById(b.log.s) : null;
  const pend = isTracked && !st && blockEnded(state.weekStart, b);
  const node = h("div", {
    class: "block" + (t.hatch ? " hatch" : "") + (height < 30 ? " tiny" : "") + (current ? " current" : "")
      + (st || pend ? " has-badge" : "") + (st && st.id === "pulei" ? " skipped" : ""),
    "data-id": b.id, tabindex: "0", role: "button",
    "aria-label": `${b.text}, ${blockRange(b)}${st ? ", " + st.label : pend ? ", sem registro" : ""}`,
  });
  Object.assign(node.style, { top: b.slot * H + 1 + "px", height: height + "px", background: t.color, border: t.border, color: t.textColor || "#111" });
  const handle = h("div", { class: "rh", "aria-hidden": "true" });
  handle.addEventListener("pointerdown", (e) => startResize(e, b, node));
  node.append(h("span", { class: "bt" }, b.text));
  if (st) node.append(h("span", { class: "badge st-" + st.id, "aria-hidden": "true" }, st.icon));
  else if (pend) node.append(h("span", { class: "badge pending", "aria-hidden": "true" }, "?"));
  if (height >= 40) node.append(h("span", { class: "br" }, blockRange(b)));
  node.append(handle);
  gesture(node, {
    onTap: () => openBlockSheet(b.id),
    onDrag: (ev) => {
      const r = node.getBoundingClientRect();
      startDrag({ kind: "move", blockId: b.id, typeId: b.typeId, minutes: b.minutes, label: b.text, node, grabX: ev.clientX - r.left, grabY: ev.clientY - r.top }, ev);
    },
  });
  node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openBlockSheet(b.id); } });
  return node;
}

function renderNowLine() {
  document.querySelectorAll(".now-line").forEach((n) => n.remove());
  const ln = logicalNow();
  if (ln.week !== state.weekStart || ln.min >= END_MIN) return;
  const wrap = document.querySelector(`.day-slots[data-day="${ln.day}"]`);
  if (!wrap) return;
  const line = h("div", { class: "now-line" });
  line.style.top = ((ln.min - START_MIN) / SLOT_MIN) * slotH() + "px";
  wrap.append(line);
}

function nowItem(label, b, meta) {
  const t = b ? typeOf(b.typeId) : null;
  return h("div", { class: "now-item" },
    h("span", { class: "lbl" }, label),
    t ? h("span", { class: "sw", style: { background: t.color } }) : null,
    h("span", { class: "txt" }, b ? b.text : "Livre"),
    meta ? h("span", { class: "meta" }, meta) : null);
}
function renderNow() {
  const box = $("#now");
  const ln = logicalNow();
  if (ln.week !== state.weekStart) {
    box.replaceChildren(h("span", { class: "muted" }, "Você está vendo outra semana."),
      h("button", { type: "button", onclick: goToday }, "Voltar pra hoje"), ...[nextTaskItem()].filter(Boolean));
    return;
  }
  const pendBtn = () => {
    const n = pendingBlocks(ln).length;
    return n ? h("button", { type: "button", class: "go", style: { marginLeft: "auto" }, onclick: openCheckin }, `Registrar ${plural(n, "bloco", "blocos")}`) : null;
  };
  if (ln.min >= END_MIN) {
    box.replaceChildren(h("span", { class: "muted" }, "Fora do horário do quadro. Bom descanso."), ...[nextTaskItem(), pendBtn()].filter(Boolean));
    return;
  }
  const list = currentBlocks().filter((b) => b.day === ln.day).sort((a, b) => a.slot - b.slot);
  const cur = list.find((b) => { const s = slotStartMin(b.slot); return ln.min >= s && ln.min < s + b.minutes; });
  const next = list.find((b) => slotStartMin(b.slot) > ln.min);
  const items = [];
  if (cur) {
    const end = slotStartMin(cur.slot) + cur.minutes;
    items.push(nowItem("Agora", cur, `até ${hhmm(end)} · faltam ${fmtIn(end - ln.min)}`));
  } else {
    items.push(nowItem("Agora", null, next ? `até ${hhmm(slotStartMin(next.slot))}` : null));
  }
  if (next) {
    const s = slotStartMin(next.slot);
    items.push(nowItem("Depois", next, `${hhmm(s)} · em ${fmtIn(s - ln.min)}`));
  }
  const task = nextTaskItem();
  if (task) items.push(task);
  const pb = pendBtn();
  if (pb) items.push(pb);
  box.replaceChildren(...items);
}

function scrollToMin(min) {
  const sc = $("#scroller");
  const y = ((min - START_MIN) / SLOT_MIN) * slotH();
  sc.scrollTop = Math.max(0, y - sc.clientHeight / 3);
}
function goToday() {
  const ln = logicalNow();
  state.selDay = ln.day;
  goToWeek(ln.week);
  scrollToMin(Math.min(ln.min, END_MIN));
}

// ---------- wiring ----------
function closeMenu() { $("#menu").open = false; }
$("#btn-prev").onclick = () => goToWeek(addDays(state.weekStart, -7));
$("#btn-next").onclick = () => goToWeek(addDays(state.weekStart, 7));
$("#btn-today").onclick = goToday;
$("#btn-minimo").onclick = addMinimoViavel;
$("#btn-duplicate").onclick = () => { closeMenu(); duplicateWeek(); };
$("#btn-export").onclick = exportWeek;
$("#btn-import").onclick = () => { closeMenu(); if (editable()) $("#import-file").click(); };
$("#import-file").addEventListener("change", () => {
  const f = $("#import-file").files[0];
  if (f) importFile(f);
  $("#import-file").value = "";
});
$("#btn-types").onclick = openTypesSheet;
$("#btn-tasks").onclick = openTasksSheet;
$("#study").onclick = openSummary;
$("#btn-colors").onclick = openColorsSheet;
$("#armed-cancel").onclick = disarm;
$("#v-day").onclick = () => { state.view = "day"; savePrefs(); render(); };
$("#v-week").onclick = () => { state.view = "week"; savePrefs(); render(); };
$("#modal").addEventListener("click", (e) => { if (e.target === $("#modal")) closeModal(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("#modal").hidden) closeModal();
  else if (armedType) disarm();
  else closeMenu();
});
document.addEventListener("click", (e) => { if (!e.target.closest("#menu")) closeMenu(); });

let lastLogicalIso = ln0.iso;
let lastPending = -1;
setInterval(() => {
  if (drag || resizing) return;
  const ln = logicalNow();
  if (ln.iso !== lastLogicalIso) { lastLogicalIso = ln.iso; render(); return; }
  // quando um bloco termina, ele ganha a marca de "sem registro"
  const pc = pendingBlocks(ln).length;
  if (pc !== lastPending) { lastPending = pc; render(); return; }
  renderNow();
  renderNowLine();
  document.querySelectorAll(".block.current").forEach((n) => n.classList.remove("current"));
  if (ln.week === state.weekStart) {
    for (const b of currentBlocks()) {
      const s = slotStartMin(b.slot);
      if (b.day === ln.day && ln.min >= s && ln.min < s + b.minutes) {
        const n = document.querySelector(`.block[data-id="${b.id}"]`);
        if (n) n.classList.add("current");
      }
    }
  }
}, 30000);

// ---------- boot ----------
applyChrome();
render();
scrollToMin(Math.min(ln0.min, END_MIN));

(async () => {
  const use = window.claude && typeof window.claude.use === "function" ? window.claude.use.bind(window.claude) : null;
  const dlP = use ? use("downloads").catch(() => null) : Promise.resolve(null);
  let d = null;
  try { d = use ? await use("db") : null; } catch { d = null; }
  downloads = await dlP;
  if (!d) {
    mode = "local";
    loadLocal();
    setSync("local");
    applyChrome();
    render();
    maybeAutoPalette();
    return;
  }
  db = d;
  mode = "sync";
  setSync("loading");
  subscribeTypes();
  subscribeTasks();
  subscribeWeek(state.weekStart);
})();
})();
</script>
